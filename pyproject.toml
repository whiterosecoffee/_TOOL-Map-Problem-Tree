[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpt"
version = "0.1.0"
description = "Traverse and edit free spanning trees of problem graphs"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mpt = "mpt.cli:main"

[tool.setuptools]
packages = ["mpt"]
